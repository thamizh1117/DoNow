<!DOCTYPE html>
<html>
<head>
    <title>Today's Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <h1>🎯 Today's Task</h1>

    <p id="task">Click Next Task</p>

    <button onclick="getTask()">Next Task</button>

    <button onclick="completeTask()">Done ✅</button>

    <h2 id="xp">⭐ XP: 0</h2>

    <h3>📜 Today's History</h3>

    <ul id="history"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
